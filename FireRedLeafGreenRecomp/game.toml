# game.toml — Pokémon FireRed Version (GBA)
#
# The runner reads this to decide which ROM to load, which region
# config to layer in, where the entry point is, and what save chip
# is expected. All fields are also reachable from the TCP debug
# server so probes can sanity-check the loaded build.
#
# NOTE: builds use the gbarecomp *worktree* at ../gbarecomp-wt-firered,
# NOT the live ../gbarecomp tree (which is busy with Minish Cap). That
# worktree does not exist yet — see README.md "Worktree prerequisite".

[game]
name           = "Pokémon FireRed Version"
short_name     = "firered"
# Default region; override at configure time. Each region's full
# config lives in config/<region>.toml and is layered on top of this.
default_region = "usa"

# ── BIOS identity ────────────────────────────────────────────────────
#
# The GBA BIOS is real, executed code. The runner refuses to launch
# without a hash-verified BIOS. See ../gbarecomp/PRINCIPLES.md
# "BIOS is sacred". The BIOS is shared across every gbarecomp game.
[bios]
path = "../gbarecomp/bios/gba_bios.bin"   # default; override via --bios
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

# ── ROM identity ─────────────────────────────────────────────────────
#
# rom = absolute or relative path to the user's ROM image.
# sha1 = expected SHA-1; if it doesn't match the runner refuses to
#        launch (see CLAUDE.md "ROM hash gates everything").
[rom]
path = "roms/firered_usa.gba"   # user-provided; not in this repo
# sha1 is filled in per region in config/<region>.toml.

# ── Recompiler entry & layout ───────────────────────────────────────
#
# entry_point is the cartridge ROM base; the real entry is the ARM
# branch in the ROM header at 0x08000000 → crt0. gba_scan extracts it.
[recompiler]
entry_point   = "0x08000000"
seeds         = "symbols/imported_symbols.tsv"
boundaries    = "symbols/function_boundaries.tsv"
out_dir       = "generated"
strict        = true

# ── Save chip ────────────────────────────────────────────────────────
#
# FireRed/LeafGreen use 1 Mbit (128 KB) flash (agb_flash_1m). The exact
# size is set per-region in config/<region>.toml.
[save]
type = "flash1m"          # one of: sram | flash512 | flash1m | eeprom

# ── Runtime ─────────────────────────────────────────────────────────
#
# debug_port is distinct from MinishCapRecomp's 19842 so both games'
# runners can be up at once without colliding.
[runtime]
debug_port    = 19852
window_title  = "FireRedRecomp"

# ── Function table (dispatch hints) ─────────────────────────────────
#
# Discovered function addresses go here, grouped by ARM/THUMB mode.
# tools/import_pokefirered_symbols seeds symbols/*.tsv from the decomp
# .sym; gba_recompile expands them during code generation.
[functions]
arm   = []
thumb = []
