[package]
name = "firered-native-prototype"
version = "0.1.0"
edition = "2024"

[features]
default = ["renderer"]
renderer = ["dep:bevy"]

[[bin]]
name = "firered-native-prototype"
path = "src/main.rs"
required-features = ["renderer"]

[[bin]]
name = "firered-core-check"
path = "src/core_check.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "=0.17.2", optional = true, default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_window", "bevy_winit", "bevy_log", "default_font", "png", "bevy_gltf", "animation", "bevy_post_process", "bevy_anti_alias"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
debug = 0

